<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A&amp;P</title>
<meta name="description" content="A&amp;P — седмичен планер / личный недельный планировщик.">
<meta name="theme-color" content="#f4f5fb">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="application-name" content="A&amp;P">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="A&amp;P">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
/* Ранняя установка темы, чтобы не было мигания при запуске */
(function(){try{var t=localStorage.getItem('ap_theme');var dark=t==='dark'||(t==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light'}catch(e){}})();
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="shell">
  <header class="topbar">
    <div class="brand">
      <img class="logo" src="icons/icon-192.png" alt="" width="44" height="44">
      <div class="brand-text">
        <h1>A&amp;P</h1>
        <p id="subtitle">Седмичен планер</p>
      </div>
    </div>
    <div class="top-actions">
      <button class="icon-btn lang-btn" id="langBtn" type="button" data-action="toggleLang">БГ</button>
      <button class="icon-btn" id="lockBtn" type="button" data-action="lockNow"></button>
      <button class="icon-btn" id="themeBtn" type="button" data-action="toggleTheme"></button>
    </div>
  </header>

  <main id="view" tabindex="-1" aria-live="polite"></main>
</div>

<nav class="nav" aria-label="Основная навигация">
  <button type="button" data-action="tab" data-tab="week" id="nav-week"></button>
  <button type="button" data-action="tab" data-tab="archive" id="nav-archive"></button>
  <button type="button" data-action="tab" data-tab="more" id="nav-more"></button>
</nav>

<div class="progress" id="progress" hidden role="progressbar" aria-valuemin="0" aria-valuemax="100"><span id="pLabel"></span><div class="pbar"><i id="pFill"></i></div><span id="pPct"></span></div>

<button class="fab" id="fab" type="button" data-action="addTask" hidden></button>

<div class="layer" id="sheet" role="dialog" aria-modal="true"><div class="panel"></div></div>
<div class="layer" id="dialog" role="dialog" aria-modal="true"><div class="panel"></div></div>
<div class="lock" id="lock" hidden>
  <form class="lock-card" data-form="unlock" novalidate>
    <img class="lock-logo" src="icons/icon-192.png" alt="" width="96" height="96">
    <h1>A&amp;P</h1>
    <p class="lock-sub" id="lockSub"></p>
    <input id="lock-pin" type="password" inputmode="numeric" autocomplete="off" maxlength="32">
    <p class="field-error" id="lock-err" role="alert"></p>
    <p class="field-hint" id="lock-hint"></p>
    <button type="submit" class="btn btn-primary btn-block" id="lockSubmit"></button>
    <button type="button" class="lock-lang" id="lockLang" data-action="toggleLang"></button>
  </form>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<noscript><p style="padding:24px;font-family:sans-serif">A&amp;P изисква включен JavaScript. / Нужен включённый JavaScript.</p></noscript>
<script src="firebase-config.js"></script>
<script src="cloud.js"></script>
<script src="app.js"></script>
</body>
</html>
